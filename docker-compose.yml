services:
  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    user: "0"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "8001:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:8000/shell/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  cognito:
    build:
      context: ./backend
    command: ["uvicorn", "local_cognito.main:app", "--host", "0.0.0.0", "--port", "9100"]
    environment:
      LOCAL_JWT_SECRET: local-only-demo-signing-key-change-me
    ports:
      - "9100:9100"

  api:
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      LOCAL_DEV: "true"
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      DYNAMODB_TABLE_NAME: exception-management
      LOCAL_UPLOAD_DIR: /app/uploads
      COGNITO_LOCAL_URL: http://cognito:9100
      COGNITO_LOCAL_ISSUER: http://localhost:9100
      LOCAL_JWT_SECRET: local-only-demo-signing-key-change-me
      WEBHOOK_SHARED_SECRET: local-only-webhook-secret
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      dynamodb:
        condition: service_healthy
      cognito:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_LOCAL_DEMO_LOGIN: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  dynamodb-data:
  frontend-node-modules:
